name: Build OpenWrt

on:
  workflow_dispatch:
    inputs:
      openwrt_ref:
        description: "OpenWrt tag or branch"
        required: true
        default: "v25.12.5"

permissions:
  contents: read

env:
  OPENWRT_REPO: https://github.com/openwrt/openwrt.git

jobs:
  build:
    name: Build x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v4

      - name: Resolve OpenWrt ref
        shell: bash
        run: |
          REF="${{ github.event.inputs.openwrt_ref }}"
          if [ -z "$REF" ]; then
            REF="v25.12.5"
          fi
          echo "OPENWRT_REF=$REF" >> "$GITHUB_ENV"
          echo "Using OpenWrt ref: $REF"

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            llvm \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            libelf-dev \
            python3 \
            python3-dev \
            python3-setuptools \
            python3-pyelftools \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            time \
            ccache \
            xsltproc \
            libxml-parser-perl \
            device-tree-compiler \
            dwarves \
            cmake \
            ninja-build \
            pkg-config \
            jq

          clang --version
          llvm-strip --version
          pahole --version

      - name: Clone OpenWrt
        shell: bash
        run: |
          git clone \
            --depth 1 \
            --branch "$OPENWRT_REF" \
            "$OPENWRT_REPO" \
            openwrt

          cd openwrt
          git log -1 --oneline

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: openwrt-dl-${{ env.OPENWRT_REF }}-${{ hashFiles('configs/**', 'scripts/**', 'package/custom/**') }}
          restore-keys: |
            openwrt-dl-${{ env.OPENWRT_REF }}-
            openwrt-dl-

      - name: Update and install feeds
        shell: bash
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Run custom pre-build script
        shell: bash
        run: |
          chmod +x scripts/custom.sh scripts/integrate-yaof-packages.sh
          ./scripts/custom.sh "$GITHUB_WORKSPACE/openwrt"

      - name: Copy local custom packages
        shell: bash
        run: |
          if [ -d package/custom ]; then
            mkdir -p openwrt/package/custom
            cp -a package/custom/. openwrt/package/custom/
          fi

      - name: Copy rootfs overlay
        shell: bash
        run: |
          if [ -d files ]; then
            mkdir -p openwrt/files
            cp -a files/. openwrt/files/
          fi

      - name: Load build configuration
        shell: bash
        run: |
          cp configs/x86_64.config openwrt/.config
          cd openwrt
          make defconfig

          echo "===== diffconfig ====="
          ./scripts/diffconfig.sh

      - name: Verify custom package configuration
        shell: bash
        run: |
          cd openwrt

          required_symbols=(
            CONFIG_BPF_TOOLCHAIN_HOST
            CONFIG_KERNEL_BPF_EVENTS
            CONFIG_KERNEL_CGROUP_BPF
            CONFIG_KERNEL_DEBUG_INFO_BTF
            CONFIG_KERNEL_XDP_SOCKETS
            CONFIG_KERNEL_DEBUG_FS
            CONFIG_PACKAGE_luci-compat

            CONFIG_PACKAGE_dae
            CONFIG_PACKAGE_dae-geoip
            CONFIG_PACKAGE_dae-geosite
            CONFIG_PACKAGE_luci-app-dae-ui

            CONFIG_PACKAGE_ddns-go
            CONFIG_PACKAGE_luci-app-ddns-go

            CONFIG_PACKAGE_kixdns
            CONFIG_PACKAGE_luci-app-kixdns-ui
            CONFIG_PACKAGE_drill

            CONFIG_PACKAGE_luci-app-partexp
            CONFIG_PACKAGE_cpulimit
            CONFIG_PACKAGE_luci-app-cpulimit
            CONFIG_PACKAGE_luci-app-sqm
            CONFIG_PACKAGE_sqm-scripts

            CONFIG_PACKAGE_einat-ebpf
            CONFIG_PACKAGE_luci-app-einat
            CONFIG_PACKAGE_luci-app-xlnetacc
            CONFIG_PACKAGE_bandix
            CONFIG_PACKAGE_luci-app-bandix

            CONFIG_PACKAGE_kmod-oaf
            CONFIG_PACKAGE_appfilter
            CONFIG_PACKAGE_luci-app-oaf

            CONFIG_PACKAGE_zerotier
            CONFIG_PACKAGE_luci-app-zerotier

            CONFIG_PACKAGE_luci-app-passwall
            CONFIG_PACKAGE_luci-app-passwall_Nftables_Transparent_Proxy
            CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Geoview
            CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Haproxy
            CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Rust_Client
            CONFIG_PACKAGE_luci-app-passwall_INCLUDE_ShadowsocksR_Libev_Client
            CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Simple_Obfs
            CONFIG_PACKAGE_luci-app-passwall_INCLUDE_SingBox
            CONFIG_PACKAGE_luci-app-passwall_INCLUDE_V2ray_Plugin
            CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray
          )

          for symbol in "${required_symbols[@]}"; do
            if ! grep -qx "${symbol}=y" .config; then
              echo "Required OpenWrt symbol is not enabled: $symbol" >&2
              exit 1
            fi
          done

          required_makefiles=(
            package/custom/dae/Makefile
            package/custom/luci-app-dae-ui/Makefile
            package/custom/ddns-go/Makefile
            package/custom/luci-app-ddns-go/Makefile
            package/custom/kixdns/Makefile
            package/custom/luci-app-kixdns-ui/Makefile

            package/custom/luci-app-partexp/Makefile
            package/custom/cpulimit/Makefile
            package/custom/luci-app-cpulimit/Makefile
            package/custom/einat-ebpf/Makefile
            package/custom/luci-app-einat/Makefile
            package/custom/luci-app-xlnetacc/Makefile
            package/custom/bandix/Makefile
            package/custom/luci-app-bandix/Makefile
            package/custom/oaf/Makefile
            package/custom/open-app-filter/Makefile
            package/custom/luci-app-oaf/Makefile
            package/custom/luci-app-zerotier/Makefile

            package/custom/luci-app-passwall/Makefile
            package/custom/chinadns-ng/Makefile
            package/custom/dns2socks/Makefile
            package/custom/geoview/Makefile
            package/custom/ipt2socks/Makefile
            package/custom/shadowsocks-rust/Makefile
            package/custom/shadowsocksr-libev/Makefile
            package/custom/simple-obfs/Makefile
            package/custom/tcping/Makefile
            package/custom/v2ray-plugin/Makefile
          )

          for makefile in "${required_makefiles[@]}"; do
            if [ ! -f "$makefile" ]; then
              echo "Required package Makefile is missing: $makefile" >&2
              exit 1
            fi
          done

          echo "DAE + DDNS-Go + KixDNS + requested YAOF apps preflight checks passed."

          echo "===== Legacy LuCI compatibility checks ====="

          legacy_luci_makefiles=(
            package/custom/luci-app-cpulimit/Makefile
            package/custom/luci-app-xlnetacc/Makefile
            package/custom/luci-app-oaf/Makefile
            package/custom/luci-app-passwall/Makefile
          )

          for makefile in "${legacy_luci_makefiles[@]}"; do
            if ! grep -q 'luci-compat' "$makefile"; then
              echo "Legacy LuCI package does not depend on luci-compat: $makefile" >&2
              exit 1
            fi
          done

          modern_luci_views=(
            package/custom/luci-app-partexp/htdocs/luci-static/resources/view
            feeds/luci/applications/luci-app-sqm/htdocs/luci-static/resources/view
            package/custom/luci-app-einat/htdocs/luci-static/resources/view
            package/custom/luci-app-bandix/htdocs/luci-static/resources/view
            package/custom/luci-app-zerotier/htdocs/luci-static/resources/view
          )

          for viewdir in "${modern_luci_views[@]}"; do
            if [ ! -d "$viewdir" ]; then
              echo "Expected modern LuCI JS view directory is missing: $viewdir" >&2
              exit 1
            fi
          done

          echo "LuCI compatibility checks passed."

      - name: Download package sources
        shell: bash
        run: |
          cd openwrt
          make download -j"$(nproc)"
          find dl -type f -size -1024c -print -delete

      - name: Build firmware
        shell: bash
        run: |
          cd openwrt
          make -j"$(nproc)" V=s || make -j1 V=s

      - name: Collect build metadata
        if: always()
        shell: bash
        run: |
          mkdir -p build-info

          {
            echo "OpenWrt ref: $OPENWRT_REF"
            echo "GitHub run: $GITHUB_RUN_ID"
            echo "Builder commit: $GITHUB_SHA"
            echo
            echo "Pinned sources:"
            cat scripts/sources.lock
          } > build-info/build.txt

          if [ -f openwrt/.config ]; then
            cp openwrt/.config build-info/openwrt.config
          fi

          if [ -x openwrt/scripts/diffconfig.sh ]; then
            (
              cd openwrt
              ./scripts/diffconfig.sh
            ) > build-info/diffconfig.txt || true
          fi

      - name: Prepare firmware artifact
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          rm -rf artifact-source firmware-artifact
          mkdir -p artifact-source/target artifact-source/build-info

          cp -a openwrt/bin/targets/x86/64/. artifact-source/target/
          cp -a build-info/. artifact-source/build-info/

          chmod +x scripts/prepare-release-assets.sh
          ./scripts/prepare-release-assets.sh artifact-source firmware-artifact

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-x86_64-${{ env.OPENWRT_REF }}
          path: firmware-artifact/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-build-debug-${{ env.OPENWRT_REF }}
          path: |
            build-info/*
            openwrt/logs/**
          if-no-files-found: ignore
          retention-days: 7
