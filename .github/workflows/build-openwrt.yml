name: Build OpenWrt

on:
  workflow_dispatch:
    inputs:
      openwrt_ref:
        description: "OpenWrt tag or branch"
        required: true
        default: "v25.12.5"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "configs/**"
      - "scripts/**"
      - "files/**"
      - "package/**"

permissions:
  contents: read

env:
  OPENWRT_REPO: https://github.com/openwrt/openwrt.git

jobs:
  build:
    name: Build x86_64
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v4

      - name: Resolve OpenWrt ref
        shell: bash
        run: |
          REF="${{ github.event.inputs.openwrt_ref }}"
          if [ -z "$REF" ]; then
            REF="v25.12.5"
          fi
          echo "OPENWRT_REF=$REF" >> "$GITHUB_ENV"
          echo "Using OpenWrt ref: $REF"

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y             build-essential             clang             flex             bison             g++             gawk             gcc-multilib             g++-multilib             gettext             git             libncurses-dev             libssl-dev             libelf-dev             python3             python3-setuptools             python3-pyelftools             rsync             swig             unzip             zlib1g-dev             file             wget             curl             time             ccache             xsltproc             libxml-parser-perl             device-tree-compiler

      - name: Clone OpenWrt
        shell: bash
        run: |
          git clone             --depth 1             --branch "$OPENWRT_REF"             "$OPENWRT_REPO"             openwrt
          cd openwrt
          git log -1 --oneline

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: openwrt-dl-${{ env.OPENWRT_REF }}-${{ hashFiles('configs/**', 'scripts/**') }}
          restore-keys: |
            openwrt-dl-${{ env.OPENWRT_REF }}-
            openwrt-dl-

      - name: Update and install feeds
        shell: bash
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Run custom pre-build script
        shell: bash
        run: |
          chmod +x scripts/custom.sh
          ./scripts/custom.sh "$GITHUB_WORKSPACE/openwrt"

      - name: Copy local custom packages
        shell: bash
        run: |
          if [ -d package/custom ]; then
            mkdir -p openwrt/package/custom
            cp -a package/custom/. openwrt/package/custom/
          fi

      - name: Copy rootfs overlay
        shell: bash
        run: |
          if [ -d files ]; then
            mkdir -p openwrt/files
            cp -a files/. openwrt/files/
          fi

      - name: Load build configuration
        shell: bash
        run: |
          cp configs/x86_64.config openwrt/.config
          cd openwrt
          make defconfig
          echo "===== diffconfig ====="
          ./scripts/diffconfig.sh

      - name: Download package sources
        shell: bash
        run: |
          cd openwrt
          make download -j"$(nproc)"
          find dl -type f -size -1024c -print -delete

      - name: Build firmware
        shell: bash
        run: |
          cd openwrt
          make -j"$(nproc)" V=s || make -j1 V=s

      - name: Collect build metadata
        if: always()
        shell: bash
        run: |
          mkdir -p build-info
          {
            echo "OpenWrt ref: $OPENWRT_REF"
            echo "GitHub run: $GITHUB_RUN_ID"
            echo "Builder commit: $GITHUB_SHA"
          } > build-info/build.txt

          if [ -f openwrt/.config ]; then
            cp openwrt/.config build-info/openwrt.config
          fi

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-x86_64-${{ env.OPENWRT_REF }}
          path: |
            openwrt/bin/targets/x86/64/*
            build-info/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-build-debug-${{ env.OPENWRT_REF }}
          path: |
            build-info/*
            openwrt/logs/**
          if-no-files-found: ignore
          retention-days: 7
