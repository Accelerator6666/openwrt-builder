name: Publish OpenWrt Release

on:
  workflow_run:
    workflows:
      - "Build OpenWrt"
    types:
      - completed

  workflow_dispatch:
    inputs:
      run_id:
        description: "Successful Build OpenWrt workflow run ID"
        required: true
        default: "36970085668"
      openwrt_ref:
        description: "OpenWrt ref used by the successful build"
        required: true
        default: "v25.12.5"
      tag:
        description: "Optional release tag; leave blank for an automatic tag"
        required: false
        default: ""
      title:
        description: "Optional release title; leave blank for an automatic title"
        required: false
        default: ""

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: Publish release assets
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout publisher scripts
        uses: actions/checkout@v4

      - name: Resolve source build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.inputs.run_id }}
          OPENWRT_REF: ${{ github.event.inputs.openwrt_ref }}
          REQUESTED_TAG: ${{ github.event.inputs.tag }}
          REQUESTED_TITLE: ${{ github.event.inputs.title }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            SOURCE_RUN_ID="$(jq -r '.workflow_run.id' "$GITHUB_EVENT_PATH")"
            REQUESTED_TAG=""
            REQUESTED_TITLE=""

            artifacts_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100")"
            artifact_name="$(jq -r '.artifacts[].name | select(startswith("openwrt-x86_64-"))' <<<"$artifacts_json" | head -n1)"

            if [ -z "$artifact_name" ]; then
              echo "No OpenWrt x86_64 firmware artifact was found for run $SOURCE_RUN_ID." >&2
              exit 1
            fi

            OPENWRT_REF="${artifact_name#openwrt-x86_64-}"
          else
            artifact_name="openwrt-x86_64-${OPENWRT_REF}"
          fi

          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
          status="$(jq -r '.status' <<<"$run_json")"
          conclusion="$(jq -r '.conclusion' <<<"$run_json")"
          run_number="$(jq -r '.run_number' <<<"$run_json")"
          head_sha="$(jq -r '.head_sha' <<<"$run_json")"
          event="$(jq -r '.event' <<<"$run_json")"

          if [ "$status" != "completed" ] || [ "$conclusion" != "success" ]; then
            echo "Source workflow run $SOURCE_RUN_ID is not a successful completed run." >&2
            echo "status=$status conclusion=$conclusion" >&2
            exit 1
          fi

          safe_ref="${OPENWRT_REF//\//-}"
          release_tag="${REQUESTED_TAG:-${safe_ref}-x86_64-r${run_number}}"
          release_title="${REQUESTED_TITLE:-OpenWrt ${OPENWRT_REF} x86_64 Custom Build (r${run_number})}"
          {
            echo "SOURCE_RUN_ID=$SOURCE_RUN_ID"
            echo "SOURCE_RUN_NUMBER=$run_number"
            echo "SOURCE_HEAD_SHA=$head_sha"
            echo "SOURCE_EVENT=$event"
            echo "OPENWRT_REF=$OPENWRT_REF"
            echo "ARTIFACT_NAME=$artifact_name"
            echo "RELEASE_TAG=$release_tag"
            echo "RELEASE_TITLE=$release_title"
          } >> "$GITHUB_ENV"

          echo "Source run: $SOURCE_RUN_ID (#$run_number)"
          echo "Source commit: $head_sha"
          echo "Artifact: $artifact_name"
          echo "Release tag: $release_tag"

      - name: Download firmware artifact
        uses: actions/download-artifact@v5
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifact-source
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail

          rm -rf release-assets

          # Newer build runs already upload a flat, release-ready artifact.
          # Older successful runs preserve OpenWrt's original directory tree.
          if find artifact-source -maxdepth 1 -type f -name '*-combined*.img.gz' -print -quit | grep -q . \
             && [ -f artifact-source/SHA256SUMS ]; then
            mkdir -p release-assets
            cp -a artifact-source/. release-assets/
            echo "Artifact is already release-ready."
          else
            chmod +x scripts/prepare-release-assets.sh
            ./scripts/prepare-release-assets.sh artifact-source release-assets
          fi

      - name: Validate release assets
        shell: bash
        run: |
          set -euo pipefail

          echo "===== Release assets ====="
          find release-assets -maxdepth 1 -type f -printf '%f\t%s bytes\n' | sort

          if ! find release-assets -maxdepth 1 -type f -name '*-combined*.img.gz' -print -quit | grep -q .; then
            echo "No combined x86_64 firmware image found in artifact." >&2
            exit 1
          fi

          if [ ! -f release-assets/SHA256SUMS ]; then
            echo "SHA256SUMS is missing from the release-ready artifact." >&2
            exit 1
          fi

          (
            cd release-assets
            sha256sum -c SHA256SUMS
          )

      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail

          cat > release-notes.md <<EOF
          Custom OpenWrt x86_64 firmware based on **OpenWrt ${OPENWRT_REF}**.

          Build provenance:
          - Build workflow run: #${SOURCE_RUN_NUMBER}
          - Build run ID: ${SOURCE_RUN_ID}
          - Builder commit used for firmware: ${SOURCE_HEAD_SHA}
          - Firmware artifact: ${ARTIFACT_NAME}
          - Release tag tracks the current builder repository state; firmware provenance is the build run and builder commit above.

          Included custom integrations:
          - DAE + luci-app-dae-ui
          - DDNS-Go + LuCI
          - KixDNS + LuCI
          - PassWall
          - OpenAppFilter (OAF)
          - EINAT
          - Bandix
          - ZeroTier
          - SQM
          - CPU Limit
          - PartExp
          - XLNetAcc

          Recommended image selection:
          - UEFI + squashfs: *-squashfs-combined-efi.img.gz
          - Legacy BIOS + squashfs: *-squashfs-combined.img.gz
          - UEFI + ext4: *-ext4-combined-efi.img.gz
          - Legacy BIOS + ext4: *-ext4-combined.img.gz

          For upgrades, keep the existing boot mode and filesystem family unless deliberately migrating.
          Back up the configuration first and verify the selected file against SHA256SUMS.
          EOF

          if [ -f release-assets/IMAGE_GUIDE.txt ]; then
            {
              echo
              echo '### Image guide'
              echo
              echo '```text'
              cat release-assets/IMAGE_GUIDE.txt
              echo '```'
            } >> release-notes.md
          fi

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.md
          fi

          gh release upload "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Show release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
