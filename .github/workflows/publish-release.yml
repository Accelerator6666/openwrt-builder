name: Publish OpenWrt Release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Successful Build OpenWrt workflow run ID"
        required: true
        default: "36970085668"
      artifact_name:
        description: "Artifact name produced by the build workflow"
        required: true
        default: "openwrt-x86_64-v25.12.5"
      tag:
        description: "GitHub Release tag"
        required: true
        default: "openwrt-v25.12.5-custom-20261002"
      title:
        description: "GitHub Release title"
        required: true
        default: "OpenWrt v25.12.5 x86_64 Custom Build"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: Publish release assets
    runs-on: ubuntu-24.04

    steps:
      - name: Download firmware artifact
        uses: actions/download-artifact@v5
        with:
          name: ${{ github.event.inputs.artifact_name }}
          path: release-input
          repository: ${{ github.repository }}
          run-id: ${{ github.event.inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Inspect downloaded files
        shell: bash
        run: |
          echo "===== Downloaded artifact ====="
          find release-input -maxdepth 4 -type f -printf '%p\t%k KB\n' | sort

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-assets

          # Firmware images and standard OpenWrt metadata.
          find release-input -type f \( \
            -name '*.img.gz' -o \
            -name '*.img' -o \
            -name '*rootfs*.tar.gz' -o \
            -name '*.manifest' -o \
            -name 'profiles.json' -o \
            -name 'sha256sums' -o \
            -name '*.buildinfo' \
          \) -exec cp -a {} release-assets/ \;

          # Preserve our custom build metadata as clearly named assets.
          if [ -f release-input/build.txt ]; then
            cp release-input/build.txt release-assets/custom-build.txt
          fi
          if [ -f release-input/diffconfig.txt ]; then
            cp release-input/diffconfig.txt release-assets/custom-diffconfig.txt
          fi
          if [ -f release-input/openwrt.config ]; then
            cp release-input/openwrt.config release-assets/custom-openwrt.config
          fi

          if ! find release-assets -maxdepth 1 -type f | grep -q .; then
            echo "No release assets were found." >&2
            exit 1
          fi

          echo "===== Release assets ====="
          ls -lh release-assets

      - name: Generate release notes
        shell: bash
        env:
          RUN_ID: ${{ github.event.inputs.run_id }}
          ARTIFACT_NAME: ${{ github.event.inputs.artifact_name }}
        run: |
          cat > release-notes.md <<EOF
          Custom OpenWrt x86_64 build based on OpenWrt v25.12.5.

          Build workflow run: #${RUN_ID}
          Artifact: ${ARTIFACT_NAME}

          Included custom integrations:
          - DAE + luci-app-dae-ui
          - DDNS-Go + LuCI
          - KixDNS + LuCI
          - PassWall
          - OpenAppFilter (OAF)
          - EINAT
          - Bandix
          - ZeroTier
          - SQM
          - CPU Limit
          - PartExp
          - XLNetAcc

          The release includes firmware images, OpenWrt metadata, checksums, manifests,
          and the custom build configuration when present.
          EOF

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag }}
          TITLE: ${{ github.event.inputs.title }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --notes-file release-notes.md
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --notes-file release-notes.md \
              --target "$GITHUB_SHA"
          fi

          gh release upload "$TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Show release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY"
